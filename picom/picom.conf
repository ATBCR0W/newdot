# Minimal noir setup - moderate opacity everywhere, nothing fancy
# If this doesn't visibly change anything once running, the issue is
# compositing itself failing to attach, not a config problem.

backend = "xrender";
vsync = true;

shadow = false;
fading = false;
blur-method = "none";

# global opacity - applies to every window, no per-app rules
active-opacity = 0.90;
inactive-opacity = 0.85;
frame-opacity = 1.0;

# force full opacity for gaming - transparency looks bad mid-game
opacity-rule = [
  "100:fullscreen",
  "100:class_g = 'Steam'",
  "100:class_g *= 'steam_app'",
  "100:class_g = 'Wine'",
  "100:class_g *= 'wine'",
  "100:WM_CLASS *= 'protontricks'"
];

corner-radius = 6;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;

use-damage = true;
unredir-if-possible = true;
xrender-sync-fence = true;
