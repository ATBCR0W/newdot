# ============================================================================
# CROW kitty config - darker noir retro
# ============================================================================

font_family      Departure Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 10
confirm_os_window_close 0
hide_window_decorations yes

background_opacity 0.85
dynamic_background_opacity yes

cursor_shape underline
cursor_blink_interval 0.5
cursor_underline_thickness 2.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

# ============================================================================
# Colors - darker, muted noir palette
# ============================================================================
background            #050506
foreground             #8a8f8a
cursor                 #6b5b7a
cursor_text_color      #050506
selection_background   #3a2f42
selection_foreground   #c1c5d9

url_color #7a1f1c

# black
color0  #1c1b1f
color8  #3a383f

# red - dark, muted
color1  #8f2d2a
color9  #b5433d

# green - dark, muted
color2  #3f6e50
color10 #578268

# yellow
color3  #6b4a30
color11 #8a6142

# blue
color4  #3d3e4d
color12 #54556a

# magenta / plum - muted
color5  #5c4d68
color13 #6b5b7a

# cyan
color6  #2a4d42
color14 #3d6b5c

# white
color7  #8a8f8a
color15 #b5bab5

active_tab_background   #3a2f42
active_tab_foreground   #c1c5d9
inactive_tab_background #1c1b1f
inactive_tab_foreground #6e6b72

active_border_color   #5c4d68
inactive_border_color #1c1b1f

enable_audio_bell no
visual_bell_duration 0
copy_on_select yes
scrollback_lines 2000

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
