include-file = ~/.config/polybar/colors.ini

; ==================================================
;                  Base Bar
; ==================================================
[bar/main]
width = 100%
background = ${colors.bar-background}
foreground = ${colors.text}
line-size = 0
border-size = 0
border-color = ${colors.transparent}
padding-left = 0
padding-right = 1
module-margin = 1
separator = " "
separator-foreground = ${colors.transparent}
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"
modules-left = i3
modules-center = date
modules-right = playback volume cpu memory
cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false

; ==================================================
;                    Top Bar
; ==================================================
[bar/top]
inherit = bar/main
bottom = false
height = 24pt

; ==================================================
;                  Bottom Bar
; ==================================================
[bar/bottom]
inherit = bar/main
bottom = true
height = 24pt

; ==================================================
;                    Modules
; ==================================================

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-focused = %name%
label-focused-background = ${colors.plum}
label-focused-foreground = ${colors.background}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.grey}
label-unfocused-padding = 1
label-urgent = %name%
label-urgent-background = #e53935
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.text}

[module/playback]
type = custom/script
exec = playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null || echo "No media"
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
label = %output:0:40:...%
label-foreground = ${colors.text}

[module/volume]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.grey}
ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
ramp-foreground = ${colors.plum}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU %percentage%%
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = MEM %percentage_used%%
label-foreground = ${colors.text}
